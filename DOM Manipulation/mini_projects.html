<body>
    <!-- * Project 1 : Live Character Counter -->
     <!-- Show remaining characters in a textarea (like Twitter/LinkedIn). -->
      <p>Live Character Count</p>
      <textarea class="txtArea" draggable="false" name="" id="" rows="10" cols="40"> 
      </textarea> <br><br>
      <div class="txt-stats">
        <span id="currentChars">00</span>/20
       <br> <span>Remaining Character allowed : </span> <span id="reaminChars"></span>
        <!-- max 20 chars -->
      </div>
